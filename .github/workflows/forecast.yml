name: forecast

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run forecast
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m airwise.five_day
      - name: Save results
        run: |
          git config user.name "airwise-bot"
          git config user.email "airwise-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update forecast data"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "could not push after 3 tries"
          exit 1
